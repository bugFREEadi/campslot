# Render Blueprint — New → Blueprint → select bugFREEadi/campslot
# After deploy, set APP_ORIGIN to the exact https://*.onrender.com URL, then redeploy once.
services:
  - type: web
    name: campusslot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_PATH
        value: /app/data/campusslot.sqlite
    disk:
      name: campusslot-data
      mountPath: /app/data
      sizeGB: 1
