# Render Blueprint — New → Blueprint → select bugFREEadi/campslot
# Free tier: no persistent disk. SQLite lives in the container filesystem and
# resets on redeploy/restart. After first deploy, open the site and use
# "First run? Initialize the demo" once (repeat after each redeploy if wiped).
# Then set APP_ORIGIN to the exact https://….onrender.com URL and redeploy once
# so CSRF/cookies match the public origin.
services:
  - type: web
    name: campusslot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_PATH
        value: /app/data/campusslot.sqlite
