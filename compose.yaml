services:
  campusslot:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      DATABASE_PATH: /app/data/campusslot.sqlite
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - campusslot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  campusslot-data:
